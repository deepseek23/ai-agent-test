<text x="390.0" y="334.75" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e1e1e">BM25Retriever</text>
<text x="390.0" y="355.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">(keyword / sparse)</text>
<text x="390.0" y="375.25" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">k = 10</text>
<rect x="620" y="300" width="300" height="100" rx="10" ry="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
<text x="770.0" y="334.75" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e1e1e">Chroma vector DB</text>
<text x="770.0" y="355.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">bge-small-en-v1.5 embeds</text>
<text x="770.0" y="375.25" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">filter: status=active</text>
<rect x="460" y="450" width="280" height="70" rx="10" ry="10" fill="#ffe8cc" stroke="#1e1e1e" stroke-width="2"/>
<text x="600.0" y="479.875" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e1e1e">EnsembleRetriever</text>
<text x="600.0" y="500.125" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">(hybrid, 0.5 / 0.5)</text>
<rect x="460" y="570" width="280" height="90" rx="10" ry="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/>
<text x="600.0" y="599.75" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e1e1e">knowledge_base_search tool</text>
<text x="600.0" y="620.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">(formats passages w/ source,</text>
<text x="600.0" y="640.25" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">status, authority for the LLM)</text>
<rect x="800" y="570" width="300" height="110" rx="10" ry="10" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/>
<text x="950.0" y="599.625" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e1e1e">order_lookup tool</text>
<text x="950.0" y="619.875" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">(JSON order DB, PII-safe</text>
<text x="950.0" y="640.125" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">field allowlist, cancel-</text>
<text x="950.0" y="660.375" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">window logic)</text>
<rect x="460" y="700" width="640" height="110" rx="10" ry="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="780.0" y="729.625" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e1e1e">SECURITY PIPELINE</text>
<text x="780.0" y="749.875" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">input sanitizer (prompt-injection)</text>
<text x="780.0" y="770.125" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">PII detector/masker (in + out)</text>
<text x="780.0" y="790.375" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">output validator (harmful patterns)</text>
<rect x="460" y="850" width="640" height="120" rx="10" ry="10" fill="#eebefa" stroke="#1e1e1e" stroke-width="2"/>
<text x="780.0" y="874.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e1e1e">AGENT (LangChain)</text>
<text x="780.0" y="894.75" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">create_agent(llm, tools, system_prompt)</text>
<text x="780.0" y="915.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">LLM: Gemini (init_chat_model)</text>
<text x="780.0" y="935.25" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">MemorySaver checkpointer (per-thread)</text>
<text x="780.0" y="955.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">grounding & data-contract system prompt</text>
<rect x="460" y="1010" width="640" height="100" rx="10" ry="10" fill="#bac8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="780.0" y="1044.75" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e1e1e">run_agent(user_input)</text>
<text x="780.0" y="1065.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">input check -> agent.invoke -> output check</text>
<text x="780.0" y="1085.25" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">+ structured logging of tool calls</text>
<rect x="600" y="1150" width="380" height="60" rx="10" ry="10" fill="#c3fae8" stroke="#1e1e1e" stroke-width="2"/>
<text x="790.0" y="1185.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">Final response to user</text>
