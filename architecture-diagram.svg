<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1250" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="0" y="0" width="1180" height="1250" fill="#ffffff"/>

<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#1e1e1e"/>
  </marker>
</defs>

<rect x="460" y="40" width="280" height="60" rx="10" ry="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
<text x="600.0" y="64.875" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e1e1e">knowledge-base/*.md</text>
<text x="600.0" y="85.125" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">(YAML frontmatter + MD)</text>
<rect x="460" y="150" width="280" height="100" rx="10" ry="10" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<text x="600.0" y="174.625" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e1e1e">INGESTION</text>
<text x="600.0" y="194.875" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">parse frontmatter (Pydantic)</text>
<text x="600.0" y="215.125" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">split by markdown headings</text>
<text x="600.0" y="235.375" font-size="15" font-weight="normal" text-anchor="middle" fill="#1e1e1e">attach status/authority meta</text>
